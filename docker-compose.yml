services:
  fraud-postgres:
    image: postgres:17-alpine
    container_name: fraudops-postgres
    profiles: ["core", "airflow", "apps"]
    environment:
      POSTGRES_DB: fraudops
      POSTGRES_USER: fraudops_user
      POSTGRES_PASSWORD: ${FRAUDOPS_POSTGRES_PASSWORD:-fraudops_password}
    ports:
      - "55433:5432"
    volumes:
      - fraud_postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudops_user -d fraudops"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    container_name: fraudops-airflow-init
    profiles: ["airflow"]
    depends_on:
      fraud-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${FRAUDOPS_AIRFLOW_SECRET_KEY:-fraudops-local-dev-secret}
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - airflow_home:/opt/airflow

    user: "0:0"
    command: >
      bash -c "mkdir -p /opt/airflow/fraudops_venv /opt/airflow/logs &&
      chown airflow:0 /opt/airflow /opt/airflow/fraudops_venv /opt/airflow/logs /opt/airflow/airflow.db* 2>/dev/null || true &&
      su airflow -c 'python -m venv /opt/airflow/fraudops_venv &&
      /opt/airflow/fraudops_venv/bin/python -m pip install --upgrade pip &&
      /opt/airflow/fraudops_venv/bin/python -m pip install -r /opt/airflow/project/requirements.txt &&
      airflow db migrate &&
      (airflow users create --username admin --password ${FRAUDOPS_AIRFLOW_ADMIN_PASSWORD:-admin} --firstname FraudOps --lastname Admin --role Admin --email admin@example.com || true)'"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    container_name: fraudops-airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${FRAUDOPS_AIRFLOW_SECRET_KEY:-fraudops-local-dev-secret}
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300
      FRAUDOPS_PROJECT_ROOT: /opt/airflow/project
      FRAUDOPS_POSTGRES_HOST: fraud-postgres
      FRAUDOPS_POSTGRES_PORT: 5432
      FRAUDOPS_POSTGRES_DB: fraudops
      FRAUDOPS_POSTGRES_USER: fraudops_user
      FRAUDOPS_POSTGRES_PASSWORD: ${FRAUDOPS_POSTGRES_PASSWORD:-fraudops_password}
      FRAUDOPS_API_DATABASE_URL: postgresql+psycopg://fraudops_user:${FRAUDOPS_POSTGRES_PASSWORD:-fraudops_password}@fraud-postgres:5432/fraudops
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - airflow_home:/opt/airflow
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || airflow version"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    container_name: fraudops-airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${FRAUDOPS_AIRFLOW_SECRET_KEY:-fraudops-local-dev-secret}
      FRAUDOPS_PROJECT_ROOT: /opt/airflow/project
      FRAUDOPS_POSTGRES_HOST: fraud-postgres
      FRAUDOPS_POSTGRES_PORT: 5432
      FRAUDOPS_POSTGRES_DB: fraudops
      FRAUDOPS_POSTGRES_USER: fraudops_user
      FRAUDOPS_POSTGRES_PASSWORD: ${FRAUDOPS_POSTGRES_PASSWORD:-fraudops_password}
      FRAUDOPS_API_DATABASE_URL: postgresql+psycopg://fraudops_user:${FRAUDOPS_POSTGRES_PASSWORD:-fraudops_password}@fraud-postgres:5432/fraudops
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - airflow_home:/opt/airflow
    command: scheduler

  kafka:
    image: apache/kafka:3.8.0
    container_name: fraudops-kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fraudops-kafka-ui
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraudops-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  fraud_postgres_data:
  airflow_home:
